name: Scrape streamxhd

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          # Usa el token automático de GitHub (no expira y no hay que configurar nada)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python extractor_local.py

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear"
          else
            git commit -m "chore: eventos $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventos-${{ github.run_id }}
          path: output/
          retention-days: 30
