name: Test M3U8

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run test
        run: python test_m3u8.py

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/test_m3u8.json output/test_m3u8.log.txt || true
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "test: m3u8 $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-m3u8
          path: |
            output/test_m3u8.json
            output/test_m3u8.log.txt
          retention-days: 30
